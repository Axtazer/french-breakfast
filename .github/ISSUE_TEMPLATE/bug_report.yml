name: 🐛 Bug
description: Quelque chose ne fonctionne pas comme prévu.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Que se passe-t-il ?
      description: Ce qui s'est passé, et ce qui était attendu.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir /crash?os=mac
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / tag de l'image
      placeholder: ghcr.io/axtazer/french-breakfast:1.0.0
  - type: input
    id: browser
    attributes:
      label: Navigateur et OS
      placeholder: Firefox 140 sur Windows 11
