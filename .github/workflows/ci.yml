name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # Build local uniquement (load), jamais de push depuis la CI.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: croissante:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name croissante -p 8080:8080 croissante:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/health && break
            sleep 1
          done
          curl -fsS http://localhost:8080/health | grep -q '"status":"ok"'
          curl -fsS -o /dev/null "http://localhost:8080/?victim=Lucas&by=Flo"
          curl -fsS -o /dev/null "http://localhost:8080/croissante?victim=Lucas&by=Flo"
          test "$(docker exec croissante id -u)" = "1000"

      - name: Container logs
        if: always()
        run: docker logs croissante || true
