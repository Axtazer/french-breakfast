name: Release

# Crée une GitHub Release (notes générées automatiquement) pour chaque tag vX.Y.Z.
# L'image Docker correspondante est publiée par docker-publish.yml.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${version}"
          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG")
          # Pré-release (v1.2.0-rc.1…) : jamais marquée "Latest", cohérent avec le tag Docker latest.
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          printf '```bash\ndocker pull %s\n```\n' "$image" > notes.md
          gh release create "$TAG" "${flags[@]}" --notes-file notes.md
